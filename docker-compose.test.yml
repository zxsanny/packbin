services:
  csharp:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh csharp"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      # Only a key, as in every suite service: Compose passes the runner's value through ("true" on GitHub Actions,
      # where run-suite.sh writes its timing notice) and leaves the variable out when the host has none.
      GITHUB_ACTIONS:
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  typescript:
    image: node:24
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh typescript"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  python:
    image: python:3.14
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh python"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  rust:
    image: rust:1.98
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh rust"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  cpp:
    image: gcc:16
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh cpp"]
    environment:
      SRC_ROOT: /src
      # The suite also runs the host tests under clang ASan and UBSan (run-suite.sh, AZ-4278).
      PACKBIN_CPP_SANITIZER: "1"
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  java:
    image: eclipse-temurin:26-jdk
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh java"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  go:
    image: golang:1.27
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh go"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  swift:
    image: swift:6.3.3
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh swift"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
      # SwiftPM's build output stays in the container, outside the mounted tree (the host's .build is the Mac's).
      PACKBIN_SWIFT_SCRATCH: /tmp/packbin-swift-build
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
      - swiftpm-cache:/root/.cache/org.swift.swiftpm
  dart:
    image: dart:3.13.7
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh dart"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
      GITHUB_ACTIONS:
      PUB_CACHE: /pub-cache
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
      # pub's package cache and the package's .dart_tool stay in volumes: .dart_tool/package_config.json holds the
      # absolute path of the cache, so the container's would break the host's own `dart test` in the mounted tree.
      - pub-cache:/pub-cache
      - dart-tool:/src/dart/.dart_tool
  cpp-embedded:
    build:
      context: ./cpp/embedded
    image: packbin-embedded:local
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/cpp/embedded/run.sh arm"]
    environment:
      SRC_ROOT: /src
      TEST_RESULTS: /test-results
    volumes:
      - ./:/src
      - ./test-results:/test-results
  rust-embedded:
    image: packbin-embedded:local
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/rust/embedded/run.sh image"]
    environment:
      SRC_ROOT: /src
      TEST_RESULTS: /test-results
    volumes:
      - ./:/src
      - ./test-results:/test-results
  cpp-embedded-esp:
    image: espressif/idf:v5.3.2
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: [". \"$$IDF_PATH/export.sh\" >/dev/null && exec /src/cpp/embedded/run.sh esp"]
    environment:
      SRC_ROOT: /src
      TEST_RESULTS: /test-results
    volumes:
      - ./:/src
      - ./test-results:/test-results

volumes:
  # The SwiftPM repository and manifest cache: the pinned swift-crypto is fetched once, not on every run.
  swiftpm-cache:
  # The Dart suite's pub cache (PUB_CACHE) and its .dart_tool: the pinned test and lints packages are fetched once.
  pub-cache:
  dart-tool:
