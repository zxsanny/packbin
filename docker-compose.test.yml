    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  rust:
    image: rust:1.98
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh rust"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  cpp:
    image: gcc:16
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh cpp"]
    environment:
      SRC_ROOT: /src
      FIXTURE: /fixture/golden.hex
      TEST_RESULTS: /test-results
    volumes:
      - ./:/src
      - ./fixtures/golden.hex:/fixture/golden.hex:ro
      - ./test-results:/test-results
  java:
    image: eclipse-temurin:26-jdk
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["exec /src/.github/workflows/run-suite.sh java"]
    environment:
      SRC_ROOT: /src
