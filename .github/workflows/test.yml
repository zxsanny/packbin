name: test

on:
  push:
    branches: ["**"]
    # A push that touches only the documents (a loop record) starts no run; any other path still runs in full.
    paths-ignore: ["_docs/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The versions of the per-package suites (docker-compose.test.yml); the setup steps install
      # them and ring-toolchains.sh checks them before the ring runs.
      RING_DOTNET: "10.0"
      RING_NODE: "24"
      RING_PYTHON: "3.14"
      RING_RUST: "1.98"
      RING_GCC: "16"
      RING_JDK: "26"
      RING_GO: "1.27"
      # The swift:6.3.3 suite image tag (tool-pins.txt `swift`): the runner's Swift builds the Swift drivers, else
      # ring-swift.sh builds them in that image.
      RING_SWIFT: "6.3.3"
      # ubuntu-latest has no GCC 16 release (13; 26.04 has 15), so the ring compiles in the gcc:16 image the
      # cpp suite uses, through ring-cxx.sh. The macOS sysroot recipe of language-pair.sh stays off.
      CXX: ${{ github.workspace }}/.github/workflows/ring-cxx.sh
      PACKBIN_CXX_SYSROOT: ""
      PACKBIN_RING_WORK: ${{ github.workspace }}/ring-work
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Swift drivers' build output, kept between runs (AZ-2627, C3): restored before the background build starts,
      # saved only when the key misses. The key hashes ring-swift.sh too, which sets the build: a hit never saves, so an
      # entry built another way would be rebuilt on every run. A tag run (publish.yml) builds from nothing.
      - name: Swift driver build cache
        id: ring-swift-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/packbin-ring-swift
          key: swift-v2-ring-${{ env.RING_SWIFT }}-${{ hashFiles('Package.swift', 'Package.resolved', '.github/workflows/drivers/handoff-swift/Package.swift', '.github/workflows/drivers/handoff-swift/Package.resolved', '.github/workflows/ring-swift.sh') }}
      # The gcc and swift image pulls and the Swift driver build need none of the setup actions: they run in the
      # background while the setups run, and the wait below collects them (ring-prepare.sh, AZ-2626).
      - name: start image pulls and the Swift driver build
        env:
          PACKBIN_SWIFT_CACHE: ${{ steps.ring-swift-cache.conclusion == 'success' && (steps.ring-swift-cache.outputs.cache-hit == 'true' && 'hit' || 'miss') || '' }}
        run: bash .github/workflows/ring-prepare.sh start "$RUNNER_TEMP/ring-prepare" "gcc:$RING_GCC" "swift:$RING_SWIFT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.RING_DOTNET }}.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RING_NODE }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.RING_PYTHON }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.RING_JDK }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RING_GO }}
          cache-dependency-path: |
            go/go.sum
            .github/workflows/drivers/handoff-go/go.sum
      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RING_RUST" --profile minimal --no-self-update
          rustup default "$RING_RUST"
      # npm, the Rust driver and the Go driver at the same time, then the wait for the background pulls and Swift build.
      - name: driver dependencies and builds
        run: |
          set -euo pipefail
          bash .github/workflows/ring-prepare.sh build "$RUNNER_TEMP/ring-prepare"
          bash .github/workflows/ring-prepare.sh wait "$RUNNER_TEMP/ring-prepare"
      - name: toolchain versions
        run: bash .github/workflows/ring-toolchains.sh
      - name: cross-language ring
        run: bash .github/workflows/language-pair.sh
      # The message ECC ring (AZ-2689, EC-9): 8 writers x 8 readers over the position rows. It reuses the C# and C++ driver
      # builds the ring step above kept in PACKBIN_RING_WORK (under the workspace: the gcc container sees /tmp and the repo).
      - name: message ECC ring
        run: bash .github/workflows/ring-ecc.sh
      - name: frame ring
        run: bash .github/workflows/ring-frame.sh

  # The suites and the publish gate share nothing (the gate pulls its own images), so they run beside each other and
  # beside scaffold, embedded and ring: the wall time is the longest job, not the sum (AZ-2564). The free plan runs 20 jobs
  # at the same time: this file makes 20 (AZ-2627: with 23, three jobs started 26 to 88 s late in every run, once the
  # ring), so the short suites share a job: an entry's lang lists the suites it runs one after the other. Swift, the
  # longest suite, runs as three (PACKBIN_SWIFT_PART, run-suite.sh: tests, gates, speed; AZ-2607); the publish gate is
  # the publish-gate-* jobs, each running its share of the check groups (publish-gate.test.sh --groups); the embedded
  # targets are the embedded-* jobs (cpp/embedded/run.sh host <stage>).
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: swift
            part: tests
          - lang: swift
            part: gates
          - lang: swift
            part: speed
          - lang: go
          - lang: python
          - lang: csharp rust
          - lang: cpp typescript java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # C3 (AZ-2627): each Swift part keeps its build output between runs, keyed on the part, the swift image tag and
      # the package manifests and run-suite.sh, which sets the build (a hit never saves, so an entry built another way,
      # as with batch 1's ccache compiler, would be rebuilt on every run); saved only when the key misses. A tag run
      # (publish.yml) builds from nothing. The restore keeps the files' times to the nanosecond, so SwiftPM rebuilds
      # only the package's own targets (fresh checkout).
      - name: Swift image tag
        id: swift-pin
        run: echo "tag=$(bash .github/workflows/tool-pin.sh swift)" >> "$GITHUB_OUTPUT"
      - name: Swift build cache
        id: swift-cache
        if: ${{ matrix.part != '' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swift-cache
          key: swift-v2-${{ matrix.part }}-${{ steps.swift-pin.outputs.tag }}-${{ hashFiles('Package.swift', 'Package.resolved', '.github/workflows/run-suite.sh') }}
      - name: suite
        env:
          SUITE: ${{ matrix.lang }}
          PACKBIN_SWIFT_PART: ${{ matrix.part }}
          PACKBIN_SWIFT_CACHE: ${{ steps.swift-cache.conclusion == 'success' && (steps.swift-cache.outputs.cache-hit == 'true' && 'hit' || 'miss') || '' }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          # A Swift part mounts its kept build output where docker-compose.test.yml puts it (PACKBIN_SWIFT_SCRATCH).
          kept=()
          if [ -n "$PACKBIN_SWIFT_CACHE" ]; then
            mkdir -p "$RUNNER_TEMP/swift-cache/build"
            kept=(-v "$RUNNER_TEMP/swift-cache/build:/tmp/packbin-swift-build" -e PACKBIN_SWIFT_CACHE)
          fi
          # Each suite of the entry runs; a failed one does not stop the others, and the job fails naming them.
          failed=""
          for suite in $SUITE; do
            docker compose -f docker-compose.test.yml run --rm "${kept[@]}" -e PACKBIN_SWIFT_PART "$suite" || failed="$failed $suite"
          done
          # The suite container runs as root: the cache save after a miss (tar as the runner's user) reads every file.
          if [ "$PACKBIN_SWIFT_CACHE" = miss ]; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/swift-cache"; fi
          if [ -n "$failed" ]; then
            echo "::error title=suites failed::$failed"
            exit 1
          fi

  # The gate shares, chosen from the per-group seconds of the "publish gate timing" notice of each job (AZ-2607: the
  # read-only checks are separate groups; the swift group, 215 s, has a job of its own; AZ-2625: the three real gate runs
  # of the read-only checks are a job each, the phase scenarios are two jobs, pins rides with the small groups). A job
  # whose groups start containers pulls exactly their images first (AZ-2626: the phases, readonly-full and pins start
  # five, the nojava gate copy seven, the gate and read-only probes all eight); publish-jobs.test.sh holds that map.
  publish-gate-phases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust java
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups phases

  publish-gate-phases-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust java
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups phases-rerun

  publish-gate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp java go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly,gate

  publish-gate-readonly-gate-good:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp java go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly-gate-good

  publish-gate-readonly-gate-bad:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp java go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly-gate-bad

  publish-gate-readonly-gate-nojava:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly-gate-nojava

  # The small groups ride along with readonly-full, which pulls its five images anyway.
  publish-gate-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust java
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly-full,static,crates-token,registry,vcpkg,go,manifest,npm,position,workflow,pins

  publish-gate-swift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups swift

  # The embedded targets run as three jobs (AZ-2607, C4): the arm image and stage, and two parts of the ESP stage
  # (cpp/embedded/run.sh host esp <part>). run-parts.test.sh and publish-jobs.test.sh hold every target to one part.
  embedded-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The Rust version of the ring job (RING_RUST), for the heap-free Rust API's static library (AZ-2751).
      PACKBIN_EMBEDDED_RUST: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: C++ embedded arm targets (Cortex-M QEMU, big-endian)
        run: |
          set -euo pipefail
          mkdir -p test-results
          bash cpp/embedded/run.sh host arm
      - name: Rust toolchain with the thumbv7em-none-eabihf and thumbv8m.main-none-eabihf targets
        run: |
          set -euo pipefail
          rustup toolchain install "$PACKBIN_EMBEDDED_RUST" --profile minimal --no-self-update
          rustup default "$PACKBIN_EMBEDDED_RUST"
          rustup target add thumbv7em-none-eabihf thumbv8m.main-none-eabihf
      - name: Rust heap-free API on Cortex-M4F and Cortex-M33F (QEMU run, sizes, heap and panic link checks)
        run: |
          set -euo pipefail
          mkdir -p test-results
          bash rust/embedded/run.sh host
      - name: embedded report
        if: always()
        run: cat test-results/report.csv

  embedded-esp-core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: C++ embedded ESP-IDF core builds and Arduino-ESP32 example
        run: |
          set -euo pipefail
          mkdir -p test-results
          bash cpp/embedded/run.sh host esp core
      - name: embedded report
        if: always()
        run: cat test-results/report.csv

  embedded-esp-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: C++ embedded examples from the packed component and archive
        run: |
          set -euo pipefail
          mkdir -p test-results
          bash cpp/embedded/run.sh host esp packages
      - name: embedded report
        if: always()
        run: cat test-results/report.csv

  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: required files and golden row
        run: |
          set -euo pipefail
          for d in csharp typescript python rust cpp; do
            test -d "$d"
            test -d "$d/tests"
          done
          test -d java
          test -d java/src/test
          test -d go
          ls go/*_test.go >/dev/null
          test -d swift/Sources/Packbin
          ls swift/Tests/PackbinTests/*.swift >/dev/null
          for f in \
            go/go.mod \
            Package.swift \
            fixtures/golden.hex \
            .github/workflows/test.yml \
            .github/workflows/publish.yml \
            .github/workflows/run-suite.sh \
            docker-compose.test.yml \
            docker-compose.publish.yml \
            .dockerignore \
            .env.example \
            LICENSE
          do
            test -f "$f"
          done
          grep -qx 4001000065cd1d00a3e1110100 fixtures/golden.hex
      - name: report columns
        run: bash .github/workflows/report-row.test.sh
      - name: hostile case file
        run: bash fixtures/hostile/cases.test.sh
      - name: compact text vectors
        run: bash fixtures/text/check-vectors.test.sh
      - name: compact text tables check
        run: bash scripts/text/check-emitted.test.sh
      - name: compact text tables in the packages
        run: bash scripts/text/check-emitted.sh
      - name: primitive reference vectors
        run: bash fixtures/crypto/check-vectors.test.sh
      - name: frame mode vectors
        run: bash fixtures/frame/check-vectors.test.sh
      - name: frame mode README examples
        run: bash scripts/frame/readme-examples.sh
      - name: message ECC vectors
        run: bash fixtures/ecc/check-vectors.test.sh
      - name: message ECC contract table
        run: bash fixtures/ecc/check-contract.sh
      - name: message ECC reference bounds
        run: python3 -I scripts/ecc/fuzz_reference.py
      - name: message ECC ring self-test
        run: bash .github/workflows/ring-ecc.test.sh
      - name: frame ring self-test
        run: bash .github/workflows/ring-frame.test.sh
      - name: suite runner
        run: bash .github/workflows/run-suite.test.sh
      - name: embedded harness
        run: bash cpp/embedded/lib.test.sh
      - name: Rust embedded link checks
        run: bash rust/embedded/checks.test.sh
      - name: cross-language ring wiring
        run: bash .github/workflows/ring-wiring.test.sh
      - name: cross-language ring row wiring
        run: bash .github/workflows/ring-wiring-rows.test.sh
      # Off the ring job's critical path since AZ-2626: both need only ruby and bash.
      - name: Swift ring wiring
        run: bash .github/workflows/ring-wiring-swift.test.sh
      - name: ring runner split
        run: bash .github/workflows/ring-lib.test.sh
      - name: ring preparation
        run: bash .github/workflows/ring-prepare.test.sh
      - name: loop test script
        run: bash scripts/loop-tests.test.sh
      - name: embedded parts
        run: bash cpp/embedded/run-parts.test.sh
