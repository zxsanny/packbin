name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: required files and golden row
        run: |
          set -euo pipefail
          for d in csharp typescript python rust cpp; do
            test -d "$d"
            test -d "$d/tests"
          done
          test -d java
          test -d java/src/test
          test -d go
          ls go/*_test.go >/dev/null
          test -d swift/Sources/Packbin
          ls swift/Tests/PackbinTests/*.swift >/dev/null
          for f in \
            go/go.mod \
            Package.swift \
            fixtures/golden.hex \
            .github/workflows/test.yml \
            .github/workflows/publish.yml \
            .github/workflows/run-suite.sh \
            docker-compose.test.yml \
            docker-compose.publish.yml \
            .dockerignore \
            .env.example \
            LICENSE
          do
            test -f "$f"
          done
          grep -qx 4001000065cd1d00a3e1110100 fixtures/golden.hex
      - name: report columns
        run: bash .github/workflows/report-row.test.sh
      - name: hostile case file
        run: bash fixtures/hostile/cases.test.sh
      - name: suite runner
        run: bash .github/workflows/run-suite.test.sh
      - name: embedded harness
        run: bash cpp/embedded/lib.test.sh
      - name: cross-language ring wiring
        run: bash .github/workflows/ring-wiring.test.sh
      - name: loop test script
        run: bash scripts/loop-tests.test.sh

  # The suites and the publish gate share nothing (the gate pulls its own images), so they run beside each other and
  # beside scaffold, embedded and ring: the wall time is the longest job, not the sum (AZ-2564). Since AZ-2600 each
  # language is its own job and Swift, the longest suite, runs as two (PACKBIN_SWIFT_PART, run-suite.sh); the publish
  # gate is the publish-gate-* jobs, each running its share of the check groups (publish-gate.test.sh --groups).
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: csharp
          - lang: typescript
          - lang: python
          - lang: rust
          - lang: cpp
          - lang: java
          - lang: go
          - lang: swift
            part: tests
          - lang: swift
            part: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: suite
        env:
          SUITE: ${{ matrix.lang }}
          PACKBIN_SWIFT_PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          docker compose -f docker-compose.test.yml run --rm -e PACKBIN_SWIFT_PART "$SUITE"

  # The gate shares, chosen from the per-group seconds of the "publish gate timing" notice of each job (AZ-2607: the
  # read-only checks, 350 s as one group on run 38921222391, are three groups). A job whose groups start containers
  # pulls the images first; publish-jobs.test.sh holds the list of those groups.
  publish-gate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp java go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly,gate

  publish-gate-readonly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp java go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly-gate,pins

  publish-gate-readonly-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp java go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups readonly-full

  publish-gate-phases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pull images
        run: docker compose -f docker-compose.test.yml -f docker-compose.publish.yml pull --quiet csharp typescript python rust cpp java go swift
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups phases

  # The groups that start no container: no image pull.
  publish-gate-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test results directory
        run: mkdir -p test-results
      - name: publish gate
        run: bash .github/workflows/publish-gate.test.sh --groups static,crates-token,registry,vcpkg,go,swift,manifest,npm,position,workflow

  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: C++ embedded targets (Cortex-M QEMU, big-endian, ESP-IDF)
        run: |
          set -euo pipefail
          mkdir -p test-results
          bash cpp/embedded/run.sh
      - name: embedded report
        if: always()
        run: cat test-results/report.csv

  ring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The versions of the per-package suites (docker-compose.test.yml); the setup steps install
      # them and ring-toolchains.sh checks them before the ring runs.
      RING_DOTNET: "10.0"
      RING_NODE: "24"
      RING_PYTHON: "3.14"
      RING_RUST: "1.98"
      RING_GCC: "16"
      RING_JDK: "26"
      RING_GO: "1.27"
      # The swift:6.3.3 suite image tag (tool-pins.txt `swift`): the runner's Swift builds the Swift drivers, else
      # ring-swift.sh builds them in that image.
      RING_SWIFT: "6.3.3"
      # ubuntu-latest has no GCC 16 release (13; 26.04 has 15), so the ring compiles in the gcc:16 image the
      # cpp suite uses, through ring-cxx.sh. The macOS sysroot recipe of language-pair.sh stays off.
      CXX: ${{ github.workspace }}/.github/workflows/ring-cxx.sh
      PACKBIN_CXX_SYSROOT: ""
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift ring wiring
        run: bash .github/workflows/ring-wiring-swift.test.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.RING_DOTNET }}.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RING_NODE }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.RING_PYTHON }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.RING_JDK }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RING_GO }}
          cache-dependency-path: |
            go/go.sum
            .github/workflows/drivers/handoff-go/go.sum
      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RING_RUST" --profile minimal --no-self-update
          rustup default "$RING_RUST"
      - name: GCC image
        run: docker pull "gcc:$RING_GCC"
      - name: toolchain versions
        run: bash .github/workflows/ring-toolchains.sh
      - name: driver dependencies and builds
        run: |
          set -euo pipefail
          npm ci --prefix typescript
          cargo build --quiet --manifest-path .github/workflows/drivers/handoff-rust/Cargo.toml
          bash .github/workflows/ring-go.sh /tmp/packbin-handoff-go
          bash .github/workflows/ring-swift.sh /tmp/packbin-ring-swift
      - name: cross-language ring
        run: bash .github/workflows/language-pair.sh
