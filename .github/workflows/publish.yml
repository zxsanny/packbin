name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pack every present language
        run: bash .github/workflows/publish-gate.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm cli for trusted publishing
        run: npm install -g npm@11
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: zxsanny
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates
      - name: publish present registries
        if: success()
        env:
          PACKBIN_PUBLISH: "1"
          PACKBIN_VERSION: ${{ github.ref_name }}
          NUGET_TOKEN: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/publish-registries.sh
