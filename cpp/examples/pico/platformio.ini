; Raspberry Pi Pico with the Arduino core. A fresh project adds packbin by its registry name:
;   lib_deps = zxsanny/packbin
; packbin needs C++17 in the code that includes it; the framework keeps its own standard.
[env:pico]
platform = raspberrypi
board = pico
framework = arduino
lib_deps = zxsanny/packbin
build_src_flags = -std=gnu++17
