[package]
name = "scheme-depth-probe"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe"
path = "src/main.rs"

# `text` is for the heap-free API (its `dict` needs it, and the crate's nostd module is built with it).
[dependencies]
packbin = { path = "../../../../rust", features = ["text"] }

# A workspace of its own: run.sh builds a copy of this folder outside the repository.
[workspace]
